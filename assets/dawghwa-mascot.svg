<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520" role="img" aria-labelledby="title desc">
<title id="title">Dawghwa mascot</title>
<desc id="desc">The original Dawghwa dog mascot gently floats above a soft violet glow.</desc>
<defs>
  <radialGradient id="halo"><stop offset="0" stop-color="#a66bff" stop-opacity=".28"/><stop offset=".65" stop-color="#a66bff" stop-opacity=".09"/><stop offset="1" stop-color="#a66bff" stop-opacity="0"/></radialGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="20"/></filter>
</defs>
<ellipse cx="260" cy="270" rx="205" ry="200" fill="url(#halo)" filter="url(#soft)">
  <animate attributeName="opacity" values=".72;1;.72" dur="4.8s" repeatCount="indefinite"/>
  <animate attributeName="rx" values="198;210;198" dur="4.8s" repeatCount="indefinite"/>
</ellipse>
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0;0 4;0 0" keyTimes="0;.25;.5;.75;1" dur="4.8s" repeatCount="indefinite"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 260 260;.7 260 260;0 260 260;-.7 260 260;0 260 260" dur="6.5s" repeatCount="indefinite"/>
    <image x="0" y="0" width="520" height="520" href="https://raw.githubusercontent.com/titan717/dawghwa/main/brand/mascot-source.png" preserveAspectRatio="xMidYMid meet"/>
  </g>
</g>
</svg>