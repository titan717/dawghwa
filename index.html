<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Free manhwa and manga reader in your browser · Dawghwa</title>
    <meta name="description" content="Read manhwa, manga and manhua in one long scroll. Free, no account, and recommendations learned on your device. Use it in a browser or install it." />
    <meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F8FC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:site_name" content="Dawghwa" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Free manhwa and manga reader in your browser · Dawghwa" />
    <meta property="og:description" content="Read manhwa, manga and manhua in one long scroll. Free, no account, and recommendations learned on your device. Use it in a browser or install it." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <script>
      // Apply the saved theme before first paint (no flash). Mirrors lib/settings.ts.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem("dawghwa:settings") || "{}");
          // Dark-first: dark unless the reader chose another theme, or chose to follow the system.
          var t = s.theme === "light" || s.theme === "amoled" || s.theme === "sepia" ? s.theme : s.theme === "system" && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Dawghwa needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
